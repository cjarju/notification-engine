services:

  user-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  user-service:
    build:
      context: .
      dockerfile: services/user/Dockerfile
      target: dev
    ports:
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/${USER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
    volumes:
      - ./services/user:/workspace/services/user
      - user-target:/workspace/services/user/target
      - maven-cache:/root/.m2
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      user-db:
        condition: service_healthy

  dispatcher-service:
    build:
      context: .
      dockerfile: services/dispatcher/Dockerfile
      target: dev
    ports:
      - "8082:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8080
    volumes:
      - ./services/dispatcher:/workspace/services/dispatcher
      - dispatcher-target:/workspace/services/dispatcher/target
      - maven-cache:/root/.m2
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      user-service:
        condition: service_healthy

  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
      target: dev
    ports:
      - "8081:8080"
    environment:
      DISPATCHER_SERVICE_URL: http://dispatcher-service:8080
    volumes:
      - ./services/ingestion:/workspace/services/ingestion
      - ingestion-target:/workspace/services/ingestion/target
      - maven-cache:/root/.m2
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      dispatcher-service:
        condition: service_healthy

volumes:
  maven-cache:
  user-db-data:
  user-target:
  dispatcher-target:
  ingestion-target:
